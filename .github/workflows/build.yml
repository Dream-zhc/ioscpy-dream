name: Build

on:
  push:
    branches:
      - main
      - "ci/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-checks:
    name: Rust format, lint, and tests
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust components
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Cache Cargo build data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            host/target
          key: ${{ runner.os }}-checks-${{ hashFiles('host/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-checks-

      - name: Check formatting
        run: cargo fmt --manifest-path host/Cargo.toml --all -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path host/Cargo.toml --locked --all-targets --all-features

      - name: Run tests
        run: cargo test --manifest-path host/Cargo.toml --locked --all-targets

  macos-host:
    name: macOS host (universal)
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Cargo build data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            host/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('host/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build macOS host binaries
        run: |
          cargo build --manifest-path host/Cargo.toml --release --locked --target aarch64-apple-darwin
          cargo build --manifest-path host/Cargo.toml --release --locked --target x86_64-apple-darwin

      - name: Create universal macOS binary
        run: |
          mkdir -p dist/macos
          lipo -create \
            host/target/aarch64-apple-darwin/release/ioscpy \
            host/target/x86_64-apple-darwin/release/ioscpy \
            -output dist/macos/ioscpy
          chmod +x dist/macos/ioscpy
          codesign --force --sign - dist/macos/ioscpy
          file dist/macos/ioscpy
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' host/Cargo.toml | head -1)"
          ARCHIVE="dist/ioscpy-${VERSION}-macos-universal.tar.gz"
          tar -czf "$ARCHIVE" -C dist/macos ioscpy
          shasum -a 256 dist/macos/ioscpy "$ARCHIVE" > dist/SHA256SUMS-macos
          printf '{"version":"%s","commit":"%s","platform":"macos","architectures":["arm64","x86_64"]}\n' \
            "$VERSION" "$GITHUB_SHA" > dist/build-manifest-macos.json

      - name: Upload macOS host artifact
        uses: actions/upload-artifact@v4
        with:
          name: ioscpy-macos-universal
          path: |
            dist/macos/ioscpy
            dist/*.tar.gz
            dist/SHA256SUMS-macos
            dist/build-manifest-macos.json
          if-no-files-found: error

  device-package:
    name: iOS device package (${{ matrix.scheme }})
    runs-on: macos-14
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: rootless
            make_target: device-rootless
          - scheme: rootful
            make_target: device-rootful
    env:
      THEOS: ${{ github.workspace }}/.theos
      THEOS_REVISION: 16362d3aa83a0acd56df4493d575d34306d42478

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install packaging dependencies
        run: brew install dpkg ldid xz

      - name: Install Theos
        run: |
          git clone --filter=blob:none https://github.com/theos/theos.git "$THEOS"
          git -C "$THEOS" checkout --detach "$THEOS_REVISION"
          git -C "$THEOS" submodule update --init --recursive --depth 1
          test "$(git -C "$THEOS" rev-parse HEAD)" = "$THEOS_REVISION"

      - name: Build ${{ matrix.scheme }} package
        run: make ${{ matrix.make_target }}

      - name: Collect device package
        run: |
          mkdir -p "dist/device/${{ matrix.scheme }}"
          find device/packages -maxdepth 1 -type f -name '*.deb' \
            -exec cp {} "dist/device/${{ matrix.scheme }}/" \;
          test -n "$(find "dist/device/${{ matrix.scheme }}" -maxdepth 1 -type f -name '*.deb' -print -quit)"
          shasum -a 256 "dist/device/${{ matrix.scheme }}"/*.deb \
            > "dist/SHA256SUMS-${{ matrix.scheme }}"
          VERSION="$(sed -n 's/^Version: //p' device/control | head -1)"
          printf '{"version":"%s","commit":"%s","platform":"ios","scheme":"%s"}\n' \
            "$VERSION" "$GITHUB_SHA" "${{ matrix.scheme }}" \
            > "dist/build-manifest-${{ matrix.scheme }}.json"

      - name: Upload ${{ matrix.scheme }} package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ioscpy-device-${{ matrix.scheme }}
          path: |
            dist/device/${{ matrix.scheme }}/*.deb
            dist/SHA256SUMS-${{ matrix.scheme }}
            dist/build-manifest-${{ matrix.scheme }}.json
          if-no-files-found: error
